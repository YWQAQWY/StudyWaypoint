<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102a38">
  <title>StudyWaypoint</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">W</span><div><strong>StudyWaypoint</strong><small>导入计划 · 本地保存</small></div></div>
    <nav aria-label="主导航"><button id="nav-today" class="nav-btn" data-view="today">今天</button><button id="nav-calendar" class="nav-btn" data-view="calendar">课程日历</button><button id="nav-ai" class="nav-btn" data-view="ai">AI 规划</button><button id="nav-settings" class="nav-btn" data-view="settings">设置与备份</button></nav>
  </header>
  <div id="message" role="status" aria-live="polite"></div>
  <main id="app" tabindex="-1"></main>
  <footer>个人学习计划 · 课程链接需联网打开 · 学习实验由你亲自完成</footer>
  <script src="/ai.js" defer></script>
  <script src="/app.js" defer></script>
</body>
</html>
